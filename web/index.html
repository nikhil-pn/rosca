<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rosca · the savings circle the organiser can't run away with</title>
  <meta name="description" content="A chit fund (kuri, kameti) on QoreChain whose pot no single key can move. Payouts need the winner's post-quantum ML-DSA-87 signature and a majority of members.">
  <meta name="theme-color" content="#eeeeef">
  <link rel="preload" href="fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="css/wallet.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="Rosca app">
      <div class="status-bar" aria-hidden="true">
        <span class="time">9:41</span>
        <span class="icons">
          <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.2 0 4.2.8 5.7 2.2l1.2-1.3A10 10 0 0 0 8 .4 10 10 0 0 0 1.1 3.1l1.2 1.3A8.2 8.2 0 0 1 8 2.2Zm0 3.4c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.4 6.4 0 0 0 8 3.8a6.4 6.4 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.4c.4 0 .8.2 1.1.4L8 10.6 6.9 9.4c.3-.2.7-.4 1.1-.4Z"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2"/><rect x="23.5" y="4" width="2" height="4" rx="1" opacity=".4"/></svg>
        </span>
      </div>
      <header class="top-bar">
        <button class="icon-btn" aria-label="Rosca">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="8" rx="8" ry="3.2"/><path d="M4 8v4.5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V8c0 1.8-3.6 3.2-8 3.2S4 9.8 4 8Z"/></svg>
        </button>
        <button class="pill" id="circle-picker">All circles
          <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path d="M2 5l3-3 3 3M2 9l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="avatar" aria-hidden="true">NP</span>
      </header>
      <div class="balance">
        <p class="label">Your savings</p>
        <div class="balance-row">
          <p class="num big" id="balance">$0<span class="dec">.00</span></p>
          <p class="gain"><span class="arrow">↗</span><span id="gain">+0.00%</span></p>
        </div>
      </div>
      <div class="wallet" aria-hidden="true">
        <div class="wcard silver"></div>
        <div class="wcard gold">
          <span class="brand">Rosca</span>
          <span class="kind" id="card-kind">Kuri</span>
        </div>
        <div class="pocket">
          <span class="stitch"></span>
          <span class="clasp"></span>
        </div>
      </div>
      <nav class="chips" id="circle-chips" aria-label="Your circles">
        <button class="chip active"><span class="chip-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="4" r="2.2"/><circle cx="19" cy="15" r="2.2"/><circle cx="5" cy="15" r="2.2"/></svg>
        </span>Office kuri</button>
        <button class="chip"><span class="chip-icon gold">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.4 6L12 16.2 6.5 19.3l1.4-6L3.3 9.2l6.1-.6Z"/></svg>
        </span>Family chit</button>
        <button class="chip"><span class="chip-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="2"/></svg>
        </span>Friends kameti</button>
      </nav>
      <article class="round-card" aria-live="polite">
        <header class="round-head">
          <h2 id="round-title">This round</h2>
          <span class="live-dot" id="round-state" title="Live on QoreChain testnet"></span>
        </header>
        <div class="round-grid">
          <div>
            <p class="num mid" id="pot">$0<span class="dec">.00</span></p>
            <p class="meta"><span class="tag green" id="paid-tag">0 of 0</span> paid in</p>
            <div class="bar"><span class="fill" id="paid-bar" style="width:0%"></span><span class="knob" id="paid-knob" style="left:0%"></span></div>
          </div>
          <div>
            <p class="num mid" id="share">$0<span class="dec">.00</span></p>
            <p class="meta"><span class="tag" id="round-tag">round 0</span> your share</p>
            <div class="ticks" id="ticks" aria-hidden="true"></div>
          </div>
        </div>
      </article>
      <footer class="dock">
        <div class="dock-pill">
          <button class="dock-btn active" aria-label="Wallet">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M7 6V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button class="dock-btn" aria-label="Activity">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20V5M8 5 4 9M8 5l4 4M16 4v15m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="dock-btn" aria-label="Members">
            <svg width="22" height="20" viewBox="0 0 26 22" aria-hidden="true"><circle cx="8" cy="8" r="6" opacity=".55"/><circle cx="17" cy="11" r="6" opacity=".35"/><circle cx="13" cy="17" r="4" opacity=".25"/></svg>
          </button>
        </div>
        <button class="dock-plus" aria-label="Start a circle">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </footer>
      <!-- @body -->
    </section>
    <!-- @phone -->
  </main>
</body>
</html>
